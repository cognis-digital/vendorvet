name: ports
on: [push, pull_request]
permissions:
  contents: read

# Build + smoke-test every language port. Each port mirrors the Python
# `vendorvet questionnaire <file>` command and must produce the same risk tier
# (high) and the same CI exit code (2) on the bundled high-risk fixture.
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Smoke test (Node port)
        run: |
          out=$(node ports/javascript/index.js questionnaire \
                demos/07-startup-unanswered/questionnaire.json --format json); rc=$?
          echo "$out"
          echo "$out" | grep -q '"tier": "high"'
          test "$rc" = "2"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - name: Smoke test (Shell port)
        run: |
          out=$(sh ports/shell/vendorvet.sh questionnaire \
                demos/07-startup-unanswered/questionnaire.json --format json); rc=$?
          echo "$out"
          echo "$out" | grep -q '"tier": "high"'
          test "$rc" = "2"

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.21" }
      - name: Vet + build + smoke test (Go port)
        run: |
          cd ports/go
          go vet ./...
          go build -o /tmp/vv .
          out=$(/tmp/vv questionnaire ../../demos/07-startup-unanswered/questionnaire.json --format json); rc=$?
          echo "$out"
          echo "$out" | grep -q '"tier": "high"'
          test "$rc" = "2"

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build + smoke test (Rust port)
        run: |
          cd ports/rust
          cargo build --release
          out=$(./target/release/vendorvet questionnaire \
                ../../demos/07-startup-unanswered/questionnaire.json --format json); rc=$?
          echo "$out"
          echo "$out" | grep -q '"tier": "high"'
          test "$rc" = "2"
